# 反向代理示例（Nginx）
#
# 对应访问日志分析里的两条建议：
#   1. 配置 real_ip_header，让 $remote_addr 就是真实客户端 IP；
#      否则受限流/封禁影响的是反代节点，几百名用户会被一起挡掉。
#   2. 对 .env / .git / wp- 这类扫描路径直接 return 444（不回包、不落日志），
#      比走完应用层的限流逻辑再返回 429 更省资源。
#
# 另外必须传 X-Forwarded-Proto / X-Forwarded-Host：应用用它们拼
# `url`/`pic`/`lrc` 的绝对地址，缺省时会退化成 https + 当前 Host。

upstream meting_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api-music.example.com;
    # 需要 HTTPS 时改成 443 + 证书配置后重定向
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-music.example.com;

    ssl_certificate     /etc/nginx/ssl/api-music.crt;
    ssl_certificate_key /etc/nginx/ssl/api-music.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 真实客户端 IP（如果前面还有 CDN，把它的回源网段也加进来）
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_recursive on;

    access_log /var/log/nginx/meting.access.log;
    error_log  /var/log/nginx/meting.error.log warn;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain application/json application/xml text/css text/javascript application/javascript;

    # 扫描器高频探测路径：直接断开连接
    location ~* (/\.env|/\.git|/\.aws|/\.svn|/credentials|/wp-|/wp-admin|/xmlrpc\.php|/actuator|/\.DS_Store) {
        return 444;
    }

    # 管理后台：不建议对公网开放时，用 allow/deny 或只绑内网
    # location ^~ /admin {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://meting_api;
    # }

    location / {
        proxy_pass http://meting_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 这两行决定 /api 返回的绝对地址是否正确
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
